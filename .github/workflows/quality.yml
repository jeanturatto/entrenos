name: Quality

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Block high or critical dependency vulnerabilities
        run: pnpm audit:dependencies

      - name: Check formatting, lint, types and tests
        run: pnpm check

      - name: Check Expo compatibility
        run: pnpm doctor

      - name: Export web bundle
        run: pnpm build:web

      - name: Export Android and iOS bundles
        run: pnpm build:mobile

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Start local Supabase and apply migrations
        run: supabase start

      - name: Lint database
        run: supabase db lint --local --level warning

      - name: Test database schema and RLS foundation
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
